<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        body{
            margin:0;
            padding:0;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content:flex-end;
            gap: 10px;
            position: relative;
            background-color: lightskyblue;
            font-size: 18px;
            padding: 10px;
        }
        .sidebar{
            height: 100vh;
            width: 200px;
            font-size: 18px;
            padding: 10px;
            background-color: salmon;
            position: absolute;
            left: 0;
            top:0;
            transform: translateX(-100%);
            transition: all ease-in 0.3s;
        }
        .show-sidebar{
            transform: translateX(0%)
        }
    </style>
</head>
<body>
    <nav>Navbar <button>Toggle</button></nav>
    <div class="sidebar">
        Sidebar
    </div>
    <script src="script.js"></script>
</body>
</html>
